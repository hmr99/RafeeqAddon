name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa
      - name: Fetch QuestieDB (Forever data)
        run: git clone --depth 1 https://github.com/Questie/QuestieDB.git ../QuestieDB
      - name: Play-test with QuestieDB
        run: python3 tests/run.py --qdb ../QuestieDB
      - name: Play-test without QuestieDB
        run: python3 tests/run.py
      - name: CurseForge upload script sends valid metadata
        run: sh tests/upload_check.sh
