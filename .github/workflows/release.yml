name: Release
# A release is published when ANY of these happens:
#   1. the version in Rafeeq/Rafeeq.toc changes on main   (normal path - bump.py + push)
#   2. a tag vX.Y.Z is pushed
#   3. a release vX.Y.Z is published from the GitHub Releases page
# Every path: tests -> zip -> GitHub release (+ zip) -> CurseForge, exactly once per version.
on:
  push:
    branches: [main]
    paths: ["Rafeeq/Rafeeq.toc"]
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

# One run at a time per version; later runs see the release already exists and step aside.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Which version, and is it already out?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOC_VERSION=$(sed -n 's/^## Version: *//p' Rafeeq/Rafeeq.toc | tr -d '\r')
          case "$GITHUB_REF" in
            refs/tags/*) VERSION="${GITHUB_REF_NAME#v}" ;;
            *)           VERSION="$TOC_VERSION" ;;
          esac
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if [ "$TOC_VERSION" != "$VERSION" ]; then
            echo "::error::TOC version ($TOC_VERSION) does not match $TAG"; exit 1
          fi
          # a release published from the GitHub page is handled by its own (release-event) run;
          # every other path skips when the version is already released
          if [ "${{ github.event_name }}" != "release" ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG is already released - nothing to do."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"
      - if: env.SKIP != '1'
        run: pip install lupa
      - if: env.SKIP != '1'
        run: git clone --depth 1 https://github.com/Questie/QuestieDB.git ../QuestieDB

      - name: Tests must pass before anything ships
        if: env.SKIP != '1'
        run: |
          python3 tests/run.py --qdb ../QuestieDB
          python3 tests/run.py
          sh tests/upload_check.sh

      - name: Package
        if: env.SKIP != '1'
        run: |
          ZIP="Rafeeq-v$VERSION.zip"
          zip -qr "$ZIP" Rafeeq -x "*.DS_Store"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          # release notes = this version's CHANGELOG section
          awk "/^## v$VERSION /{f=1;next} /^## v/{f=0} f" CHANGELOG.md > notes.md

      - name: GitHub release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$VERSION" in *alpha*|*beta*) PRE="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --title "Rafeeq v$VERSION" --notes-file notes.md $PRE
          else
            # creates the tag on this commit (tag pushes are not needed)
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "Rafeeq v$VERSION" --notes-file notes.md $PRE
          fi

      - name: Upload to CurseForge
        if: env.SKIP != '1'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
          CF_GAME_VERSIONS: ${{ vars.CF_GAME_VERSIONS }}
          CHANGELOG_FILE: notes.md
        run: sh scripts/upload-curseforge.sh
