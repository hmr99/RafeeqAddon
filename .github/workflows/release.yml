name: Release
# Either push a tag like v0.4.0-beta1, or publish a release with that tag from the GitHub
# Releases page -> tests -> zip -> GitHub release asset -> CurseForge.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

# Publishing from the Releases page can fire both the tag push and the release event.
# Runs are serialised per tag, and the tag-push run steps aside when a release already exists,
# so CurseForge gets exactly one upload.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: One run per release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME was published from GitHub - the release-event run handles it."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"
      - run: pip install lupa
        if: env.SKIP != '1'
      - run: git clone --depth 1 https://github.com/Questie/QuestieDB.git ../QuestieDB
        if: env.SKIP != '1'

      - name: Tests must pass before anything ships
        if: env.SKIP != '1'
        run: |
          python3 tests/run.py --qdb ../QuestieDB
          python3 tests/run.py

      - name: Check tag matches the TOC version
        if: env.SKIP != '1'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "## Version: $VERSION" Rafeeq/Rafeeq.toc || { echo "TOC version != tag $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Package
        if: env.SKIP != '1'
        run: |
          ZIP="Rafeeq-v$VERSION.zip"
          zip -qr "$ZIP" Rafeeq -x "*.DS_Store"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          # release notes = this version's CHANGELOG section
          awk "/^## v$VERSION /{f=1;next} /^## v/{f=0} f" CHANGELOG.md > notes.md

      - name: GitHub release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$VERSION" in *alpha*|*beta*) PRE="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # release was published from the GitHub page: attach the zip and the changelog
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Rafeeq v$VERSION" --notes-file notes.md $PRE
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" --title "Rafeeq v$VERSION" --notes-file notes.md $PRE
          fi

      - name: Upload to CurseForge
        if: env.SKIP != '1'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
          CF_GAME_VERSIONS: ${{ vars.CF_GAME_VERSIONS }}
          CHANGELOG_FILE: notes.md
        run: sh scripts/upload-curseforge.sh
