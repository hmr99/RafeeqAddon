<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#1b3a5c"/>
      <stop offset="0.6" stop-color="#0d1b2e"/>
      <stop offset="1" stop-color="#060b14"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="0.45" stop-color="#e8b94a"/>
      <stop offset="1" stop-color="#9c6a1c"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9f3ff"/>
      <stop offset="0.5" stop-color="#36c6f4"/>
      <stop offset="1" stop-color="#1477b8"/>
    </linearGradient>
    <linearGradient id="cyanDark" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a8fd0"/>
      <stop offset="1" stop-color="#0b4f80"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- emblem plate -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#gold)" stroke-width="10"/>
  <rect x="34" y="34" width="444" height="444" rx="92" fill="none" stroke="#e8b94a" stroke-opacity="0.25" stroke-width="2"/>

  <!-- faint map grid / path -->
  <g stroke="#36c6f4" stroke-opacity="0.10" stroke-width="2">
    <path d="M60 180 H452 M60 256 H452 M60 332 H452 M180 60 V452 M256 60 V452 M332 60 V452"/>
  </g>
  <path d="M110 400 C 170 380, 160 300, 230 300 S 300 220, 360 170" fill="none"
        stroke="#e8b94a" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 18"/>

  <!-- compass ring -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="150" fill="none" stroke="url(#gold)" stroke-width="12"/>
    <circle cx="256" cy="256" r="132" fill="#081322" fill-opacity="0.55" stroke="#e8b94a" stroke-opacity="0.35" stroke-width="2"/>
    <!-- ticks -->
    <g stroke="url(#gold)" stroke-linecap="round">
      <path d="M256 92 V122 M256 390 V420 M92 256 H122 M390 256 H420" stroke-width="10"/>
      <path d="M140 140 L156 156 M372 140 L356 156 M140 372 L156 356 M372 372 L356 356" stroke-width="6"/>
    </g>
  </g>

  <!-- needle (points north-east) -->
  <g transform="rotate(38 256 256)" filter="url(#glow)">
    <path d="M256 128 L292 256 L256 236 Z" fill="url(#cyan)"/>
    <path d="M256 128 L220 256 L256 236 Z" fill="url(#cyanDark)"/>
    <path d="M256 384 L292 256 L256 276 Z" fill="#c9d3de" fill-opacity="0.35"/>
    <path d="M256 384 L220 256 L256 276 Z" fill="#8a97a6" fill-opacity="0.35"/>
  </g>

  <!-- centre quest mark -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="40" fill="url(#gold)"/>
    <circle cx="256" cy="256" r="31" fill="#3a2508"/>
    <path d="M249 232 h14 l-3 30 h-8 z" fill="url(#gold)"/>
    <circle cx="256" cy="275" r="7" fill="url(#gold)"/>
  </g>

  <!-- destination diamond -->
  <g transform="translate(372 150) rotate(45)" filter="url(#glow)">
    <rect x="-13" y="-13" width="26" height="26" rx="4" fill="url(#gold)"/>
  </g>
</svg>
